<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Web Rider</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
addEventListener('error',function(e){
  document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:0;left:0;right:0;margin:0;color:#f66;background:#000;padding:10px;font-size:12px;white-space:pre-wrap;z-index:9">ERROR: '+e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+')</pre>');
});
</script>
<script src="game.js?v=3"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
