<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Web Rider</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: #080310; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
canvas {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block;
}
#hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
}
.hud-top {
  display: flex; justify-content: space-between; align-items: flex-start;
}
.score-box {
  display: flex; flex-direction: column; align-items: center; width: 100%;
}
.score-num {
  font-size: clamp(48px, 9vw, 84px); font-weight: 900; line-height: 0.95;
  letter-spacing: -2px; color: #ffffff;
  text-shadow: 0 0 25px rgba(255, 30, 70, 0.7), 0 4px 12px rgba(0,0,0,0.8);
}
.dist-num {
  font-size: 14px; font-weight: 700; color: #ff3366; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;
}
.gem-pill {
  position: absolute; right: 20px; top: max(16px, env(safe-area-inset-top));
  background: rgba(20, 10, 35, 0.75); border: 1.5px solid #00f0ff;
  border-radius: 20px; padding: 6px 14px; font-weight: 800; font-size: 15px;
  color: #00f0ff; display: flex; align-items: center; gap: 6px;
  box-shadow: 0 0 16px rgba(0, 240, 255, 0.3);
}
.gem-icon {
  display: inline-block; width: 10px; height: 10px; background: #00f0ff; transform: rotate(45deg);
  box-shadow: 0 0 8px #00f0ff;
}
.stunt-banner {
  position: fixed; left: 0; right: 0; top: 38%;
  text-align: center; pointer-events: none; opacity: 0;
  transform: translateY(15px) scale(0.9);
  transition: opacity 0.2s cubic-bezier(0.1, 0.9, 0.2, 1), transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
}
.stunt-banner.show {
  opacity: 1; transform: translateY(0) scale(1);
}
.stunt-text {
  font-size: clamp(24px, 5vw, 44px); font-weight: 900; font-style: italic;
  letter-spacing: 1px; color: #ffd500;
  text-shadow: 0 0 25px #ff0055, 0 4px 8px #000;
}
.stunt-sub {
  font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px;
}
.hint-tap {
  font-size: 15px; font-weight: 800; color: rgba(255, 255, 255, 0.6);
  letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 25px;
  animation: pulse 1.2s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: 0.3; } to { opacity: 0.95; } }
.overlay {
  position: fixed; inset: 0; background: rgba(8, 3, 16, 0.88);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center; pointer-events: auto;
}
.overlay.active { display: flex; }
.game-title {
  font-size: clamp(48px, 11vw, 92px); font-weight: 950; font-style: italic; line-height: 0.9;
  letter-spacing: -2px; margin: 0; color: #ff103f;
  text-shadow: 0 0 40px #ff0055, 0 4px 16px #000;
}
.game-sub {
  font-size: 14px; font-weight: 800; color: #00f0ff; letter-spacing: 5px;
  text-transform: uppercase; margin: 12px 0 32px;
}
.btn-row {
  display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
}
.btn {
  background: #ff103f; color: #fff; border: none; outline: none;
  font-family: inherit; font-size: 18px; font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; padding: 14px 36px; border-radius: 40px;
  box-shadow: 0 0 30px rgba(255, 16, 63, 0.55), 0 6px 14px rgba(0,0,0,0.5);
  cursor: pointer; transform: translateZ(0); transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active { transform: scale(0.96); box-shadow: 0 0 15px rgba(255, 16, 63, 0.8); }
.btn-sec {
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
  box-shadow: none; padding: 12px 28px;
}
.stat-grid {
  margin: 22px 0 28px; display: flex; gap: 28px;
}
.stat-col { display: flex; flex-direction: column; align-items: center; }
.stat-val { font-size: 32px; font-weight: 900; color: #fff; }
.stat-lbl { font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-top">
    <div></div>
    <div class="score-box">
      <div id="score" class="score-num">0</div>
      <div id="dist" class="dist-num">0 M</div>
    </div>
    <div class="gem-pill">
      <span class="gem-icon"></span>
      <span id="gems">0</span>
    </div>
  </div>
  <div id="tapHint" class="hint-tap">HOLD TO ACCELERATE & FLIP</div>
</div>

<div id="stuntBanner" class="stunt-banner">
  <div id="stuntTitle" class="stunt-text">NICE FLIPPING!</div>
  <div id="stuntPts" class="stunt-sub">+100 PTS</div>
</div>

<div id="menuScreen" class="overlay active">
  <h1 class="game-title">WEB<br><span style="color:#fff;text-shadow:0 0 35px #00f0ff;">RIDER</span></h1>
  <div class="game-sub">NEON SPIDER EDITION</div>
  <div class="stat-grid">
    <div class="stat-col"><span id="bestScoreMenu" class="stat-val">0</span><span class="stat-lbl">BEST</span></div>
    <div class="stat-col"><span id="totalGemsMenu" class="stat-val">0</span><span class="stat-lbl">GEMS</span></div>
  </div>
  <div class="btn-row">
    <button id="playBtn" class="btn">RIDE</button>
  </div>
</div>

<div id="overScreen" class="overlay">
  <div style="font-size:20px;font-weight:900;letter-spacing:4px;color:#ff103f;margin-bottom:6px;">WIPEOUT</div>
  <div id="finalScore" class="score-num" style="font-size:72px;">0</div>
  <div class="stat-grid">
    <div class="stat-col"><span id="bestFinal" class="stat-val">0</span><span class="stat-lbl">BEST</span></div>
    <div class="stat-col"><span id="runDist" class="stat-val">0m</span><span class="stat-lbl">DISTANCE</span></div>
    <div class="stat-col"><span id="runGems" class="stat-val" style="color:#00f0ff;">0</span><span class="stat-lbl">GEMS</span></div>
  </div>
  <div class="btn-row">
    <button id="retryBtn" class="btn">AGAIN</button>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const cv = $('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

// Audio Synth
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function playSfx(type, opt={}) {
  if (!actx) return;
  const now = actx.currentTime;
  if (type === 'gem') {
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1200 + (opt.step||0)*160, now);
    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.08);
    g.gain.setValueAtTime(0.08, now);
    g.gain.linearRampToValueAtTime(0.001, now + 0.08);
    osc.connect(g); g.connect(actx.destination);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'land') {
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.1);
    g.gain.setValueAtTime(0.12, now);
    g.gain.linearRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g); g.connect(actx.destination);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'flip') {
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(860, now + 0.22);
    g.gain.setValueAtTime(0.09, now);
    g.gain.linearRampToValueAtTime(0.001, now + 0.22);
    osc.connect(g); g.connect(actx.destination);
    osc.start(now); osc.stop(now + 0.22);
  } else if (type === 'crash') {
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(25, now + 0.45);
    g.gain.setValueAtTime(0.2, now);
    g.gain.linearRampToValueAtTime(0.001, now + 0.45);
    osc.connect(g); g.connect(actx.destination);
    osc.start(now); osc.stop(now + 0.45);
  }
}

// Storage
let save = { best: 0, gems: 0 };
try {
  const d = JSON.parse(localStorage.getItem('rider_spidey_v1') || '{}');
  if (d.best) save.best = d.best;
  if (d.gems) save.gems = d.gems;
} catch(e){}
function commitSave() {
  try { localStorage.setItem('rider_spidey_v1', JSON.stringify(save)); } catch(e){}
}

// Display Sizing
let W = innerWidth, H = innerHeight, DPR = Math.min(2, devicePixelRatio || 1);
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
addEventListener('resize', resize);
resize();

// Rider Fast Physics Tunings (Real Rider Scale)
const P = {
  dt: 1 / 180,
  substeps: 3,
  gravity: 1850,
  accel: 2400,        // High instantaneous thrust
  maxSpeed: 1050,      // Lightning fast Rider velocity
  airTorque: 14.5,     // Snappy mid-air rotations
  angularDamp: 0.15,
  friction: 0.998,
  wheelDist: 26,       // Half distance between wheels
  wheelR: 9,           // Radius
  chassisH: 14,
  headR: 12
};

// Track Building: Modular Neon Polygon Platforms (Authentic Ketchapp Style)
let platforms = [];
let gems = [];
let saws = [];
let genX = 0, genY = 0;
let trackSeed = 1;
const rnd = () => {
  trackSeed = (Math.imul(trackSeed, 1664525) + 1013904223) >>> 0;
  return trackSeed / 4294967296;
};
const R = (a, b) => a + (b - a) * rnd();

// Palette rotation every few obstacles like Rider
const THEMES = [
  { neon: '#ff0055', fill: '#14030d', glow: 'rgba(255, 0, 85, 0.45)' },
  { neon: '#00f0ff', fill: '#011219', glow: 'rgba(0, 240, 255, 0.45)' },
  { neon: '#ffe600', fill: '#181402', glow: 'rgba(255, 230, 0, 0.45)' },
  { neon: '#8400ff', fill: '#0f0219', glow: 'rgba(132, 0, 255, 0.45)' },
  { neon: '#00ff66', fill: '#011909', glow: 'rgba(0, 255, 102, 0.45)' }
];
let curThemeIdx = 0;

function addPlatform(pts, theme) {
  // Poly platform with top edge and closed polygon base
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p1 = pts[i], p2 = pts[i+1];
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy);
    if (len > 0.1) {
      segs.push({
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        dx, dy, len,
        nx: -dy / len, ny: dx / len // Normal pointing outwards
      });
    }
  }
  platforms.push({ pts, segs, theme });
}

function spawnGemsArc(p1, p2, peakH, count) {
  for (let i = 1; i <= count; i++) {
    const t = i / (count + 1);
    const x = p1.x + (p2.x - p1.x) * t;
    const baseY = p1.y + (p2.y - p1.y) * t;
    const y = baseY - peakH * Math.sin(Math.PI * t);
    gems.push({ x, y, taken: false });
  }
}

// Modular Rider Obstacle Constructors
function buildFlat(len) {
  const t = THEMES[curThemeIdx % THEMES.length];
  const pts = [
    { x: genX, y: genY },
    { x: genX + len, y: genY },
    { x: genX + len, y: genY + 180 },
    { x: genX, y: genY + 180 }
  ];
  addPlatform(pts, t);
  for (let gx = genX + 70; gx < genX + len - 50; gx += 70) {
    gems.push({ x: gx, y: genY - 32, taken: false });
  }
  genX += len;
}

function buildUpRamp() {
  const t = THEMES[curThemeIdx % THEMES.length];
  const len = R(420, 600), rise = R(140, 220);
  const steps = 14;
  const topPts = [];
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    topPts.push({
      x: genX + len * u,
      y: genY - rise * Math.pow(u, 1.8)
    });
  }
  const last = topPts[topPts.length - 1];
  const pts = [
    ...topPts,
    { x: last.x, y: genY + 220 },
    { x: genX, y: genY + 220 }
  ];
  addPlatform(pts, t);
  genX = last.x; genY = last.y;
}

function buildBigJump() {
  const t = THEMES[curThemeIdx % THEMES.length];
  // 1. Ramp kicker
  const rampLen = 380, rampRise = 160;
  const rampPts = [];
  for (let i = 0; i <= 10; i++) {
    const u = i / 10;
    rampPts.push({ x: genX + rampLen * u, y: genY - rampRise * (u*u) });
  }
  const lip = rampPts[rampPts.length - 1];
  addPlatform([
    ...rampPts,
    { x: lip.x, y: genY + 250 },
    { x: genX, y: genY + 250 }
  ], t);

  // 2. Air gap with spinning saw hazard below
  const gap = R(340, 480);
  const drop = R(120, 240);
  saws.push({ x: lip.x + gap * 0.5, y: lip.y + drop + 80, r: 40 });

  // Arching gems
  spawnGemsArc(lip, { x: lip.x + gap, y: lip.y + drop }, 140, 6);

  // 3. Smooth descending landing ramp
  const landX = lip.x + gap, landY = lip.y + drop;
  const landLen = 520, landDown = 80;
  const landPts = [];
  for (let i = 0; i <= 12; i++) {
    const u = i / 12;
    landPts.push({
      x: landX + landLen * u,
      y: landY + landDown * (1 - Math.cos(Math.PI * u * 0.5))
    });
  }
  const landEnd = landPts[landPts.length - 1];
  curThemeIdx++;
  const t2 = THEMES[curThemeIdx % THEMES.length];
  addPlatform([
    ...landPts,
    { x: landEnd.x, y: landY + 300 },
    { x: landX, y: landY + 300 }
  ], t2);

  genX = landEnd.x; genY = landEnd.y;
}

function buildHalfPipeValley() {
  const t = THEMES[curThemeIdx % THEMES.length];
  const len = R(800, 1100), depth = R(160, 260);
  const steps = 24;
  const topPts = [];
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    topPts.push({
      x: genX + len * u,
      y: genY + depth * Math.sin(Math.PI * u)
    });
  }
  const last = topPts[topPts.length - 1];
  addPlatform([
    ...topPts,
    { x: last.x, y: genY + depth + 200 },
    { x: genX, y: genY + depth + 200 }
  ], t);
  for (let i = 2; i < steps - 2; i += 2) {
    gems.push({ x: topPts[i].x, y: topPts[i].y - 35, taken: false });
  }
  genX = last.x; genY = last.y;
}

function buildLoopDeLoop() {
  curThemeIdx++;
  const t = THEMES[curThemeIdx % THEMES.length];
  const r = 180;
  const cx = genX + r + 40, cy = genY - r;
  const steps = 44;
  const loopPts = [];
  // Tangent entry at 6 o'clock: angle = PI/2. Loops full circle clockwise
  for (let i = 0; i <= steps; i++) {
    const a = Math.PI / 2 - (TAU * i / steps);
    loopPts.push({
      x: cx + Math.cos(a) * r,
      y: cy + Math.sin(a) * r
    });
    if (i % 5 === 0 && i > 0 && i < steps) {
      gems.push({ x: cx + Math.cos(a) * (r - 45), y: cy + Math.sin(a) * (r - 45), taken: false });
    }
  }
  // Add as an open track platform strip
  const loopBase = [];
  for (let i = loopPts.length - 1; i >= 0; i--) {
    const p = loopPts[i];
    const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
    loopBase.push({ x: cx + (dx/d)*(r + 30), y: cy + (dy/d)*(r + 30) });
  }
  addPlatform([...loopPts, ...loopBase], t);

  genX = cx + r + 40;
  buildFlat(400);
}

function generateTrackUntil(targetX) {
  while (genX < targetX) {
    buildFlat(R(250, 420));
    const r = rnd();
    if (r < 0.35) {
      buildUpRamp();
      buildBigJump();
    } else if (r < 0.65) {
      buildHalfPipeValley();
    } else if (r < 0.85) {
      buildBigJump();
    } else {
      buildFlat(350);
      buildLoopDeLoop();
    }
    curThemeIdx++;
  }
}

// Game State
let state = 'menu'; // 'menu', 'play', 'over'
let car = {
  x: 120, y: -40,
  vx: 0, vy: 0,
  angle: 0,
  spin: 0,
  grounded: false,
  groundTimer: 0,
  airTimer: 0,
  airRot: 0,
  flipsEarned: 0
};
let inputHeld = false;
let score = 0, distanceM = 0, sessionGems = 0;
let cam = { x: 120, y: -40, leadX: 200, zoom: 0.9 };
let particles = [];
let trails = [];
let sawAngle = 0;
let stuntTimer = 0;

function resetRun(seed) {
  trackSeed = seed;
  platforms = [];
  gems = [];
  saws = [];
  particles = [];
  trails = [];
  genX = -400; genY = 0;
  curThemeIdx = 0;
  buildFlat(1200);
  generateTrackUntil(3500);

  car.x = 180; car.y = -25;
  car.vx = 0; car.vy = 0;
  car.angle = 0; car.spin = 0;
  car.grounded = false; car.groundTimer = 0;
  car.airTimer = 0; car.airRot = 0; car.flipsEarned = 0;

  cam.x = car.x; cam.y = car.y;
  score = 0; distanceM = 0; sessionGems = 0;
  $('score').textContent = '0';
  $('dist').textContent = '0 M';
  $('gems').textContent = save.gems;
  hideStunt();
}

function showStunt(title, pts) {
  const banner = $('stuntBanner');
  $('stuntTitle').textContent = title;
  $('stuntPts').textContent = `+${pts} PTS`;
  banner.classList.add('show');
  clearTimeout(stuntTimer);
  stuntTimer = setTimeout(() => banner.classList.remove('show'), 1200);
}
function hideStunt() {
  $('stuntBanner').classList.remove('show');
}

// Segment Collision Check
function checkCircleSegment(cx, cy, r, seg) {
  const vx = cx - seg.x1, vy = cy - seg.y1;
  const t = Math.max(0, Math.min(1, (vx * seg.dx + vy * seg.dy) / (seg.len * seg.len)));
  const px = seg.x1 + t * seg.dx, py = seg.y1 + t * seg.dy;
  const dist = Math.hypot(cx - px, cy - py);
  if (dist < r) {
    return {
      hit: true,
      pen: r - dist,
      nx: (cx - px) / (dist || 1),
      ny: (cy - py) / (dist || 1),
      px, py
    };
  }
  return null;
}

function physicsStep(dt) {
  if (state !== 'play') return;

  // 1. Gravity & Motor Forces
  car.vy += P.gravity * dt;

  if (inputHeld) {
    if (car.grounded) {
      // Rapid acceleration forward along vehicle facing
      const fwdX = Math.cos(car.angle), fwdY = Math.sin(car.angle);
      const curSpeed = car.vx * fwdX + car.vy * fwdY;
      if (curSpeed < P.maxSpeed) {
        car.vx += fwdX * P.accel * dt;
        car.vy += fwdY * P.accel * dt;
      }
    } else {
      // Crisp Rider Mid-Air Flip Torque (backflip rotation)
      car.spin -= P.airTorque * dt;
      car.airRot += -P.airTorque * dt;
    }
  }

  // Angular dampening & friction
  car.spin *= Math.pow(P.angularDamp, dt);
  car.angle += car.spin * dt;

  car.x += car.vx * dt;
  car.y += car.vy * dt;

  // 2. Wheels Collision
  const cos = Math.cos(car.angle), sin = Math.sin(car.angle);
  const wBack = {
    x: car.x - cos * P.wheelDist + sin * P.wheelR,
    y: car.y - sin * P.wheelDist - cos * P.wheelR,
    rx: -cos * P.wheelDist, ry: -sin * P.wheelDist
  };
  const wFront = {
    x: car.x + cos * P.wheelDist + sin * P.wheelR,
    y: car.y + sin * P.wheelDist - cos * P.wheelR,
    rx: cos * P.wheelDist, ry: sin * P.wheelDist
  };

  let wasGrounded = car.grounded;
  let wheelContacts = 0;

  // Test wheel collisions against nearby platforms
  for (const plat of platforms) {
    if (plat.pts[1].x < car.x - 300 || plat.pts[0].x > car.x + 300) continue;
    for (const seg of plat.segs) {
      for (const w of [wBack, wFront]) {
        const col = checkCircleSegment(w.x, w.y, P.wheelR, seg);
        if (col) {
          wheelContacts++;
          // Push out
          car.x += col.nx * col.pen * 0.7;
          car.y += col.ny * col.pen * 0.7;

          // Normal & Tangent Velocity Resolution
          const vn = car.vx * col.nx + car.vy * col.ny;
          if (vn < 0) {
            car.vx -= col.nx * vn * 1.05;
            car.vy -= col.ny * vn * 1.05;
          }
          // Surface friction
          car.vx *= Math.pow(P.friction, dt * 60);
          car.vy *= Math.pow(P.friction, dt * 60);

          // Torque feedback from wheels
          const torque = (w.rx * col.ny - w.ry * col.nx) * 0.008;
          car.spin += torque;
        }
      }
    }
  }

  car.grounded = wheelContacts > 0;

  if (car.grounded) {
    car.groundTimer += dt;
    // Safe landing evaluation
    if (!wasGrounded && car.airTimer > 0.2) {
      playSfx('land');
      // Landing stunt bonus
      const totalTurns = Math.floor((Math.abs(car.airRot) + 0.4) / TAU);
      if (totalTurns > 0) {
        const titles = [
          'FLAWLESS FLIP!',
          'DOUBLE SPIN!',
          'TRIPLE ROTATION!',
          'FLIP MAESTRO!',
          'GODLIKE STUNT!'
        ];
        const tTitle = titles[Math.min(titles.length - 1, totalTurns - 1)];
        const pts = totalTurns * 150 * totalTurns;
        score += pts;
        showStunt(tTitle, pts);
        playSfx('flip');
      }
    }
    car.airTimer = 0;
    car.airRot = 0;
  } else {
    car.airTimer += dt;
    car.groundTimer = 0;
  }

  // 3. Head & Chassis Lethal Collision
  const headPos = {
    x: car.x - sin * P.chassisH,
    y: car.y + cos * P.chassisH - 12
  };

  for (const plat of platforms) {
    if (plat.pts[1].x < car.x - 200 || plat.pts[0].x > car.x + 200) continue;
    for (const seg of plat.segs) {
      // Head hit
      const hCol = checkCircleSegment(headPos.x, headPos.y, P.headR, seg);
      if (hCol) {
        triggerWipeout('Head smashed');
        return;
      }
    }
  }

  // Saw collision
  for (const saw of saws) {
    if (Math.hypot(car.x - saw.x, car.y - saw.y) < saw.r + 14) {
      triggerWipeout('Sliced by hazard');
      return;
    }
  }

  // Fall into abyss
  if (car.y > genY + 800) {
    triggerWipeout('Fell into void');
    return;
  }

  // 4. Gem Collections
  for (const g of gems) {
    if (!g.taken && Math.hypot(car.x - g.x, car.y - g.y) < 38) {
      g.taken = true;
      sessionGems++;
      save.gems++;
      score += 20;
      playSfx('gem', { step: sessionGems % 6 });
      commitSave();
      $('gems').textContent = save.gems;
    }
  }

  // Update Score & Distance
  distanceM = Math.max(distanceM, Math.floor(car.x / 14));
  $('score').textContent = score + distanceM;
  $('dist').textContent = `${distanceM} M`;

  // Dynamic Neon Trail
  trails.push({ x: car.x, y: car.y, a: car.angle, life: 1 });
  if (trails.length > 28) trails.shift();

  // Infinite Generation ahead
  if (genX < car.x + 3500) {
    generateTrackUntil(car.x + 4500);
  }
}

function triggerWipeout(reason) {
  if (state !== 'play') return;
  state = 'over';
  playSfx('crash');
  try { navigator.vibrate?.([60, 40, 90]); } catch(e){}

  // Burst particles
  for (let i = 0; i < 40; i++) {
    const ang = Math.random() * TAU, spd = R(80, 520);
    particles.push({
      x: car.x, y: car.y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: R(0.4, 0.9), color: i % 2 ? '#ff0055' : '#00f0ff',
      sz: R(3, 8)
    });
  }

  const finalVal = score + distanceM;
  if (finalVal > save.best) {
    save.best = finalVal;
    commitSave();
  }

  $('finalScore').textContent = finalVal;
  $('bestFinal').textContent = save.best;
  $('runDist').textContent = `${distanceM}m`;
  $('runGems').textContent = `+${sessionGems}`;
  $('overScreen').classList.add('active');
  $('hud').style.display = 'none';
}

// Drawing & Rendering
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Background gradient & city silhoutte
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#06010d');
  bg.addColorStop(0.7, '#130424');
  bg.addColorStop(1, '#260424');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Camera Follow (Smooth dynamic zoom & forward lead like real Rider)
  const fwdSpeed = Math.hypot(car.vx, car.vy);
  const targetLead = Math.min(260, car.vx * 0.24);
  cam.leadX += (targetLead - cam.leadX) * 0.08;
  cam.x += (car.x + cam.leadX - cam.x) * 0.12;
  cam.y += (car.y - cam.y) * 0.1;

  // Zoom dynamic: zooms out as speed surges
  const targetZoom = Math.max(0.48, Math.min(0.92, 600 / (H * 0.9 + fwdSpeed * 0.4)));
  cam.zoom += (targetZoom - cam.zoom) * 0.05;

  ctx.save();
  ctx.translate(W * 0.32, H * 0.58);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  // 1. Draw Neon Platforms (Filled polygonal blocks with thick neon edge glow)
  for (const plat of platforms) {
    if (plat.pts[1].x < cam.x - W/cam.zoom - 100 || plat.pts[0].x > cam.x + W/cam.zoom + 100) continue;
    
    // Solid fill
    ctx.beginPath();
    ctx.moveTo(plat.pts[0].x, plat.pts[0].y);
    for (let i = 1; i < plat.pts.length; i++) ctx.lineTo(plat.pts[i].x, plat.pts[i].y);
    ctx.closePath();
    ctx.fillStyle = plat.theme.fill;
    ctx.fill();

    // Top Neon Glow Border
    ctx.beginPath();
    for (let i = 0; i < plat.pts.length - 2; i++) {
      if (i === 0) ctx.moveTo(plat.pts[i].x, plat.pts[i].y);
      ctx.lineTo(plat.pts[i+1].x, plat.pts[i+1].y);
    }
    ctx.strokeStyle = plat.theme.neon;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = plat.theme.neon;
    ctx.shadowBlur = 18;
    ctx.stroke();

    // Inner bright core
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.stroke();
  }

  // 2. Draw Saws
  sawAngle += 0.08;
  for (const s of saws) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(sawAngle);
    ctx.beginPath();
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * TAU;
      const rad = i % 2 === 0 ? s.r : s.r * 0.72;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = '#ff0033';
    ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fillStyle = '#0a0314'; ctx.fill();
    ctx.restore();
  }

  // 3. Draw Collectible Gems (Rider diamond style)
  for (const g of gems) {
    if (g.taken || g.x < cam.x - W/cam.zoom - 50 || g.x > cam.x + W/cam.zoom + 50) continue;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(9, -2); ctx.lineTo(0, 12); ctx.lineTo(-9, -2);
    ctx.closePath();
    ctx.fillStyle = '#00f0ff'; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  // 4. Vehicle Trail
  for (let i = 0; i < trails.length; i++) {
    const tr = trails[i];
    const u = i / trails.length;
    ctx.save();
    ctx.translate(tr.x, tr.y);
    ctx.rotate(tr.a);
    ctx.fillStyle = `rgba(255, 0, 75, ${u * 0.4})`;
    ctx.fillRect(-P.wheelDist, -6, P.wheelDist * 2, 8);
    ctx.restore();
  }

  // 5. Draw Car & Spidey Skater
  if (state !== 'over') {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    // Skateboard Deck (High neon)
    ctx.beginPath();
    ctx.roundRect(-P.wheelDist - 8, -4, (P.wheelDist + 8) * 2, 7, 3);
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();

    // Wheels
    for (const wx of [-P.wheelDist, P.wheelDist]) {
      ctx.beginPath();
      ctx.arc(wx, P.wheelR - 2, P.wheelR, 0, TAU);
      ctx.fillStyle = '#0d111a';
      ctx.fill();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Spider-Man Mask Head
    ctx.save();
    ctx.translate(0, -P.chassisH);
    ctx.beginPath();
    ctx.arc(0, 0, P.headR, 0, TAU);
    ctx.fillStyle = '#e6002e';
    ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();

    // Spider Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(3, -2, 5, 3.2, 0.25, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(-4, -2, 4.5, 3, -0.25, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
    ctx.restore();
  }

  // 6. Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * 0.016; p.y += p.vy * 0.016;
    p.life -= 0.02;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.fillRect(p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// Main Loop
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.04, (now - lastT) / 1000);
  lastT = now;

  if (state === 'play') {
    const sdt = dt / P.substeps;
    for (let s = 0; s < P.substeps; s++) {
      physicsStep(sdt);
    }
  }

  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Input handling (Single Touch/Mouse Hold to accelerate & flip)
function onDown(e) {
  e.preventDefault();
  initAudio();
  if (state === 'play') {
    inputHeld = true;
    $('tapHint').style.opacity = '0';
  }
}
function onUp(e) {
  inputHeld = false;
}
addEventListener('pointerdown', onDown);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    initAudio();
    if (state === 'play') inputHeld = true;
  }
});
addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') inputHeld = false;
});

// UI Buttons
$('playBtn').onclick = () => {
  initAudio();
  $('menuScreen').classList.remove('active');
  $('hud').style.display = 'flex';
  state = 'play';
  resetRun(Math.floor(Math.random() * 1e9));
};

$('retryBtn').onclick = () => {
  initAudio();
  $('overScreen').classList.remove('active');
  $('hud').style.display = 'flex';
  state = 'play';
  resetRun(Math.floor(Math.random() * 1e9));
};

// Initial Menu Setup
$('bestScoreMenu').textContent = save.best;
$('totalGemsMenu').textContent = save.gems;

})();
</script>
