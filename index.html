<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14061f"><title>Flip Rider</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>
html,body{margin:0;height:100%;background:#14061f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;display:block}
</style></head><body><canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,Z;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';Z=Math.min(H/520,W/900)}
addEventListener('resize',resize);resize();

/* ===== TUNING ===== */
const G=1000,ACC=420,FR=60,ROT=4.6,WB=24,WR=7,HEADY=-21,LAND_MAX=1.0;
const vmaxOf=d=>540+160*d;

/* ===== save ===== */
let SV;try{SV=JSON.parse(localStorage.flipRider3||'{}')}catch(e){SV={}}
SV=Object.assign({best:0,gems:0},SV);
const save=()=>{try{localStorage.flipRider3=JSON.stringify(SV)}catch(e){}};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ===== audio ===== */
let ac;
function snd(f,d,type,v,f2){try{
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state!=='running')ac.resume();
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
}catch(e){}}

/* ===== helpers ===== */
const TAU=Math.PI*2;
const hs=n=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};
const norm=a=>{a%=TAU;if(a>Math.PI)a-=TAU;if(a<-Math.PI)a+=TAU;return a};
let seed=1;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const R=(a,b)=>a+(b-a)*rnd();

/* ===== terrain ===== */
let P,gems,saws,gx,gy_,gi=0,si=0;
function pt(x,y){P.push({x,y,gap:false});gx=x;gy_=y}
function gapTo(x,y){P[P.length-1].gap=true;pt(x,y)}
function idxAt(x){
  let lo=0,hi=P.length-1;
  if(x<=P[0].x)return 0;if(x>=P[hi].x)return hi-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(P[m].x<=x)lo=m;else hi=m}
  return lo;
}
function gy(x){
  if(x<P[0].x||x>=P[P.length-1].x)return null;
  const i=idxAt(x),a=P[i],b=P[i+1];
  if(a.gap)return null;
  return a.y+(b.y-a.y)*(x-a.x)/(b.x-a.x);
}
function slopeAt(x){
  let x1=x-12,x2=x+12,a=gy(x1),b=gy(x2);
  if(a==null){x1=x;a=gy(x)}
  if(b==null){x2=x;b=gy(x)}
  if(a==null||b==null||x2===x1)return 0;
  return Math.atan2(b-a,x2-x1);
}
function curve(len,fn){
  const x0=gx,y0=gy_,n=Math.max(2,Math.ceil(len/12));
  for(let i=1;i<=n;i++){const t=i/n;pt(x0+len*t,y0+fn(t))}
}
function gemsAlong(xa,xb,h,step,p){
  for(let x=xa;x<xb;x+=step){if(rnd()>p)continue;const g=gy(x);if(g!=null)gems.push({x,y:g-h,got:false})}
}
function arcGems(ex,ey,sl,n){
  const v=480,vx=v*Math.cos(sl),vy=-v*Math.sin(sl);
  for(let i=1;i<=n;i++){const t=i*.12;gems.push({x:ex+vx*t,y:ey-WR+vy*t+.5*G*t*t,got:false})}
}
function flat(len,g){const x0=gx;curve(len,()=>0);if(g)gemsAlong(x0+60,gx-40,34,50,.6)}
function rolling(len,h){
  const x0=gx,k=Math.max(1,Math.round(len/420));
  curve(len,t=>-h*(1-Math.cos(TAU*k*t))/2);
  gemsAlong(x0+40,gx-40,38,60,.65);
}
function climb(h,len){curve(len,t=>-h*(1-Math.cos(Math.PI*t))/2)}
function bigRamp(){
  const rise=R(70,120),len=R(240,320);
  curve(len,t=>-rise*Math.pow(t,1.6));
  const ex=gx,ey=gy_,sl=Math.atan(1.6*rise/len),drop=rise+R(10,50);
  arcGems(ex,ey,sl,6);
  curve(R(420,560),t=>drop*(1-(1-t)*(1-t)));
}
function pitJump(d){
  const rise=R(40,70),len=R(180,240);
  curve(len,t=>-rise*Math.pow(t,1.6));
  const ex=gx,ey=gy_,sl=Math.atan(1.6*rise/len);
  const gap=R(130,170+d*60),drop=R(40,90);
  const vx=480*Math.cos(sl);
  arcGems(ex,ey,sl,Math.max(2,Math.floor(gap/(vx*.12))));
  saws.push({x:ex+gap/2,y:ey+drop+45,r:27,a:0});
  gapTo(ex+gap,ey+drop);
  const d2=R(20,60);
  curve(R(250,320),t=>d2*(1-(1-t)*(1-t)));
}
function gen(until){
  while(gx<until){
    const d=Math.min(1,Math.max(0,(gx-2000)/60000)),r=rnd();
    flat(R(100,200),true);
    if(gy_>300)climb(-R(160,260),R(700,900));
    else if(r<.4)rolling(R(700,1300),R(50,100));
    else if(r<.65)bigRamp();
    else if(r<.85)pitJump(d);
    else{rolling(R(420,560),R(50,80));bigRamp()}
  }
}
// climb() helper expects a positive height going up; negative arg above keeps call sites simple
const _climb=climb;climb=function(h,len){_climb(-h,len)};

/* ===== state ===== */
let mode='menu',pl,pts,tt,perfectT,deadT,T=0,hold=false,shake=0,gemRun,particles=[];
const cam={x:0,y:0};
function newRun(){
  seed=(Math.random()*1e9)|0;P=[];gems=[];saws=[];particles=[];gi=0;si=0;
  pt(-600,0);curve(1700,()=>0);gen(4000);
  pl={x:100,y:-WR,vx:0,vy:0,a:0,av:0,g:true,v:300,rot:0,low:0,airT:0};
  pts=0;tt=null;perfectT=0;gemRun=0;deadT=0;shake=0;
  cam.x=pl.x;cam.y=pl.y-30;
}
const dist=()=>Math.max(0,(pl.x-100)/10);
const total=()=>Math.floor(dist()+pts);
const dd=()=>Math.min(1,dist()/6000);
const fname=n=>n<=1?'BACKFLIP':n===2?'DOUBLE BACKFLIP':n===3?'TRIPLE BACKFLIP':n+'X BACKFLIP';
const flipsOf=r=>Math.floor((Math.abs(r)+1.0)/TAU);

function die(){
  if(mode!=='play')return;
  mode='dead';deadT=0;shake=14;vib(120);snd(120,.4,'sawtooth',.15,30);
  for(let i=0;i<28;i++)particles.push({x:pl.x,y:pl.y-10,vx:(Math.random()-.5)*500,vy:-Math.random()*400,l:1,c:i%2?'#ff2a3d':'#3a7bff'});
  const t=total();if(t>SV.best)SV.best=t;save();
}

/* ===== physics ===== */
function takeOff(vx,vy){pl.g=false;pl.vx=vx;pl.vy=vy;pl.av=0;pl.rot=0;pl.airT=0}
function stepGround(dt){
  const sl=slopeAt(pl.x),vmax=vmaxOf(dd());
  pl.v+=G*.55*Math.sin(sl)*dt;
  if(hold){if(pl.v<vmax)pl.v+=ACC*dt}else pl.v-=FR*dt;
  if(pl.v>vmax)pl.v-=150*dt;
  if(pl.v<120)pl.v=120;
  const vx=pl.v*Math.cos(sl),vy=pl.v*Math.sin(sl);
  const nx=pl.x+vx*dt,g0=gy(nx);
  if(g0==null){pl.x=nx;pl.y+=vy*dt;takeOff(vx,vy);return}
  const ny=g0-WR,yBall=pl.y+vy*dt+.5*G*dt*dt;
  if(ny>yBall+.8){pl.x=nx;pl.y=yBall;takeOff(vx,vy);return}
  pl.x=nx;pl.y=ny;pl.low=ny;
  const b=gy(pl.x-WB),f=gy(pl.x+WB);
  const tgt=(b!=null&&f!=null)?Math.atan2(f-b,2*WB):sl;
  pl.a+=norm(tgt-pl.a)*Math.min(1,dt*14);
}
function land(wx){
  const sl=slopeAt(wx),rel=norm(pl.a-sl);
  if(Math.abs(rel)>LAND_MAX){die();return}
  const n=flipsOf(pl.rot);
  if(n>0){
    const p=250*n*n;pts+=p;snd(520,.15,'square',.1,900);
    let txt=fname(n)+' +'+p;
    if(Math.abs(rel)<.25){pts+=100;txt+='  PERFECT +100';perfectT=1.4}
    tt={s:txt,t:1.6};
  }
  snd(90,.08,'sine',.12,50);vib(15);
  pl.g=true;pl.a=sl+rel;pl.rot=0;pl.av=0;
  pl.v=Math.max(120,(pl.vx*Math.cos(sl)+pl.vy*Math.sin(sl))*(1-.12*Math.abs(rel)));
  const g=gy(pl.x);if(g!=null)pl.y=g-WR;
}
function stepAir(dt){
  pl.airT+=dt;
  pl.vy+=G*dt;pl.x+=pl.vx*dt;pl.y+=pl.vy*dt;
  if(pl.airT>.1){
    const tg=hold?-ROT:0;
    pl.av+=(tg-pl.av)*Math.min(1,dt*(hold?10:5));
    pl.a+=pl.av*dt;pl.rot+=pl.av*dt;
    if(!hold&&Math.abs(pl.av)<1.5){
      const target=slopeAt(pl.x+pl.vx*.3);
      pl.a+=norm(target-pl.a)*Math.min(1,dt*2.2);
    }
  }
  if(pl.airT>.06){
    for(const s of[-1,1]){
      const wx=pl.x+s*WB*Math.cos(pl.a),wy=pl.y+s*WB*Math.sin(pl.a),g=gy(wx);
      if(g!=null&&wy+WR>=g){if(wy+WR-g>22){die();return}land(wx);return}
    }
  }
  if(pl.airT>.1){
    const hx=pl.x-HEADY*Math.sin(pl.a),hy=pl.y+HEADY*Math.cos(pl.a),g=gy(hx);
    if(g!=null&&hy+10>=g){die();return}
  }
  if(pl.y>pl.low+450)die();
}
function hazards(){
  const hx=pl.x-HEADY*Math.sin(pl.a),hy=pl.y+HEADY*Math.cos(pl.a);
  while(si<saws.length&&saws[si].x<pl.x-700)si++;
  for(let j=si;j<saws.length&&saws[j].x<pl.x+100;j++){
    const s=saws[j];
    if(Math.hypot(pl.x-s.x,pl.y-s.y)<s.r+12||Math.hypot(hx-s.x,hy-s.y)<s.r+10){die();return}
  }
  while(gi<gems.length&&gems[gi].x<pl.x-700)gi++;
  for(let j=gi;j<gems.length&&gems[j].x<pl.x+100;j++){
    const c=gems[j];if(c.got)continue;
    if(Math.hypot(pl.x-c.x,pl.y-c.y)<30||Math.hypot(hx-c.x,hy-c.y)<26){
      c.got=true;SV.gems++;gemRun++;pts+=10;snd(1200+(gemRun%7)*100,.1,'triangle',.1);
      for(let i=0;i<5;i++)particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.5,c:'#6fa8ff'});
    }
  }
}
function step(dt){
  T+=dt;
  if(mode==='play'){
    if(pl.g)stepGround(dt);else stepAir(dt);
    if(mode==='play'){
      hazards();
      if(!pl.g&&pl.airT>.1){const n=flipsOf(pl.rot);if(n>0&&(!tt||tt.air!==n))tt={s:fname(n),t:9,air:n}}
      gen(pl.x+4000);
    }
  }else if(mode==='dead')deadT+=dt;
  if(tt&&pl&&pl.g){tt.t-=dt;if(tt.t<=0)tt=null}
  if(perfectT>0)perfectT-=dt;
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.l-=dt}
  particles=particles.filter(p=>p.l>0);
  shake*=Math.pow(.02,dt);
}

/* ===== drawing ===== */
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c0a2e');g.addColorStop(.6,'#3a0f3a');g.addColorStop(1,'#7a1530');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,230,230,.12)';ctx.beginPath();ctx.arc(W*.8,H*.2,H*.09,0,TAU);ctx.fill();
  const L=[[.06,'#1a0f3d',150,46],[.14,'#140a30',110,58],[.28,'#0e0623',80,72]];
  L.forEach(([f,c,hh,w],li)=>{
    const off=cam.x*f,i0=Math.floor(off/w),base=H*.82-cam.y*f*.25*Z;
    ctx.fillStyle=c;
    for(let i=i0;i*w-off<W+w;i++){
      const h=hh*(.35+.65*hs(i*3+li*91));
      ctx.fillRect(i*w-off,base-h,w-3,H);
      if(li===0&&hs(i*7)>.6){ctx.fillStyle='rgba(255,220,120,.5)';ctx.fillRect(i*w-off+8,base-h+12,5,5);ctx.fillStyle=c}
    }
  });
}
function drawTrack(xl,xr){
  ctx.lineJoin='round';ctx.lineCap='round';
  const i0=Math.max(0,idxAt(xl)-1);
  const path=()=>{
    ctx.beginPath();let pen=false;
    for(let i=i0;i<P.length-1;i++){
      const a=P[i],b=P[i+1];
      if(a.x>xr)break;
      if(a.gap){pen=false;continue}
      if(!pen){ctx.moveTo(a.x,a.y);pen=true}
      ctx.lineTo(b.x,b.y);
    }
  };
  ctx.shadowColor='#ff2a3d';ctx.shadowBlur=22;ctx.strokeStyle='#ff2a3d';ctx.lineWidth=6;path();ctx.stroke();
  ctx.shadowBlur=0;ctx.strokeStyle='#ffd6da';ctx.lineWidth=2;path();ctx.stroke();
}
function drawObjs(xl,xr){
  for(let j=gi;j<gems.length&&gems[j].x<xr;j++){
    const c=gems[j];if(c.got||c.x<xl)continue;
    ctx.fillStyle='#6fa8ff';ctx.shadowColor='#4d8dff';ctx.shadowBlur=12;ctx.beginPath();
    ctx.moveTo(c.x,c.y-9);ctx.lineTo(c.x+6,c.y);ctx.lineTo(c.x,c.y+9);ctx.lineTo(c.x-6,c.y);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  }
  for(let j=si;j<saws.length&&saws[j].x<xr+60;j++){
    const s=saws[j];if(s.x<xl-60)continue;
    s.a+=.15;
    ctx.fillStyle='#ff5a5f';ctx.shadowColor='#ff2a3d';ctx.shadowBlur=14;ctx.beginPath();
    for(let i=0;i<28;i++){const a=s.a+i/28*TAU,r=i%2?s.r*.78:s.r;ctx.lineTo(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r)}
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#2a0a1a';ctx.beginPath();ctx.arc(s.x,s.y,5,0,TAU);ctx.fill();
  }
}
function drawPlayer(){
  ctx.save();ctx.translate(pl.x,pl.y);ctx.rotate(pl.a);ctx.scale(1.25,1.25);
  ctx.fillStyle='#fff';
  for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*WB,0,WR,0,TAU);ctx.fill();ctx.fillStyle='#3a7bff';ctx.beginPath();ctx.arc(s*WB,0,2.5,0,TAU);ctx.fill();ctx.fillStyle='#fff'}
  ctx.shadowColor='#3a7bff';ctx.shadowBlur=12;ctx.fillStyle='#2a6bff';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-36,-WR-6);ctx.quadraticCurveTo(-30,-WR+1,-24,-WR+1);ctx.lineTo(24,-WR+1);ctx.quadraticCurveTo(30,-WR+1,36,-WR-6);
  ctx.lineTo(30,-WR-3);ctx.lineTo(-30,-WR-3);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.translate(0,HEADY);
  ctx.fillStyle='#e0192d';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(0,11);ctx.moveTo(-11,0);ctx.lineTo(11,0);ctx.moveTo(-8,-8);ctx.lineTo(8,8);ctx.moveTo(8,-8);ctx.lineTo(-8,8);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,5.5,0,TAU);ctx.moveTo(8,0);ctx.arc(0,0,8,0,TAU);ctx.stroke();
  ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1;
  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*2,1);ctx.quadraticCurveTo(s*6,-5,s*10,-1);ctx.quadraticCurveTo(s*7,5,s*2,1);ctx.fill();ctx.stroke()}
  ctx.restore();
}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1}
function hud(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const u=Math.min(W,H*1.6)/700+.4;
  ctx.textBaseline='alphabetic';ctx.lineJoin='round';
  ctx.font=`900 ${34*u}px "Courier New",monospace`;ctx.textAlign='center';
  ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.fillStyle='#fff';
  const s=String(total());ctx.strokeText(s,W/2,44*u);ctx.fillText(s,W/2,44*u);
  ctx.font=`700 ${14*u}px "Courier New",monospace`;ctx.lineWidth=3;
  const d=Math.floor(dist())+' m';ctx.strokeText(d,W/2,64*u);ctx.fillStyle='#ffb3b9';ctx.fillText(d,W/2,64*u);
  ctx.textAlign='left';ctx.fillStyle='#6fa8ff';ctx.font=`900 ${18*u}px system-ui,sans-serif`;
  const gt='◆ '+SV.gems;ctx.strokeText(gt,16,34*u);ctx.fillText(gt,16,34*u);
  ctx.textAlign='right';ctx.fillStyle='#ffd54a';const bt='BEST '+SV.best;ctx.strokeText(bt,W-16,34*u);ctx.fillText(bt,W-16,34*u);
  if(tt&&mode==='play'){
    ctx.textAlign='center';ctx.font=`italic 900 ${38*u}px system-ui,sans-serif`;ctx.lineWidth=6;
    ctx.globalAlpha=Math.min(1,tt.t);ctx.strokeStyle='#000';ctx.fillStyle=perfectT>0?'#ffd54a':'#fff';
    const t=tt.s.toLowerCase();ctx.strokeText(t,W/2,H-60*u);ctx.fillText(t,W/2,H-60*u);ctx.globalAlpha=1;
  }
  if(mode==='menu'||mode==='dead'){
    ctx.fillStyle='rgba(8,2,18,.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(mode==='menu'){
      ctx.font=`900 ${64*u}px system-ui,sans-serif`;ctx.fillStyle='#ff2a3d';ctx.shadowColor='#f00';ctx.shadowBlur=24;
      ctx.fillText('FLIP RIDER',W/2,H*.38);ctx.shadowBlur=0;
      ctx.font=`700 ${16*u}px system-ui,sans-serif`;ctx.fillStyle='#fff';
      ctx.fillText('HOLD = SPEED ON GROUND · BACKFLIP IN AIR',W/2,H*.48);
      ctx.fillText('RELEASE BEFORE LANDING TO LEVEL OUT',W/2,H*.48+24*u);
    }else{
      ctx.font=`900 ${26*u}px system-ui,sans-serif`;ctx.fillStyle='#ff2a3d';ctx.fillText('WIPEOUT',W/2,H*.3);
      ctx.font=`900 ${70*u}px "Courier New",monospace`;ctx.fillStyle='#fff';ctx.fillText(String(total()),W/2,H*.47);
      ctx.font=`700 ${16*u}px system-ui,sans-serif`;ctx.fillStyle='#ffd54a';
      ctx.fillText((total()>=SV.best?'NEW BEST!  ':'BEST '+SV.best+'  ')+'· '+Math.floor(dist())+' m · ◆ '+gemRun,W/2,H*.47+30*u);
    }
    if(mode==='menu'||deadT>.5){
      ctx.globalAlpha=.55+.45*Math.sin(T*5);ctx.font=`900 ${22*u}px system-ui,sans-serif`;ctx.fillStyle='#fff';
      ctx.fillText('TAP TO '+(mode==='menu'?'START':'RETRY'),W/2,H*.72);ctx.globalAlpha=1;
    }
  }
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);bg();
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  const ax=W*.33,ay=H*.6;
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*(ax-cam.x*Z+sx),DPR*(ay-cam.y*Z+sy));
  const xl=cam.x-ax/Z-60,xr=cam.x+(W-ax)/Z+60;
  drawTrack(xl,xr);drawObjs(xl,xr);drawParticles();
  if(mode!=='dead')drawPlayer();
  hud();
}

/* ===== input ===== */
const ptr=new Set();let keys=0;
const sync=()=>{hold=ptr.size>0||keys>0};
function press(){
  if(mode==='menu'){newRun();mode='play'}
  else if(mode==='dead'&&deadT>.5){newRun();mode='play'}
  snd(1,.01,'sine',.001);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr.add(e.pointerId);sync();press()});
const up=e=>{ptr.delete(e.pointerId);sync()};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{ptr.clear();keys=0;sync()});
const KEYS=['Space','ArrowUp','ArrowRight','ArrowLeft','ArrowDown','KeyW','KeyA','KeyS','KeyD'];
addEventListener('keydown',e=>{if(KEYS.includes(e.code)){e.preventDefault();if(!e.repeat){keys++;sync();press()}}});
addEventListener('keyup',e=>{if(KEYS.includes(e.code)){keys=Math.max(0,keys-1);sync()}});

/* ===== loop ===== */
newRun();
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;
  while(acc>=1/120){step(1/120);acc-=1/120}
  const tx=pl.x,ty=pl.y-30;
  cam.x+=(tx-cam.x)*Math.min(1,dt*8);cam.y+=(ty-cam.y)*Math.min(1,dt*4);
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
