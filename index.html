<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070c"><title>Web Rider</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>
html,body{margin:0;height:100%;background:#07070c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,system-ui,Arial,sans-serif;color:#fff}
canvas{position:fixed;inset:0;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(5,0,3,.55);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.t{font-size:min(15vw,110px);font-weight:900;line-height:.92;letter-spacing:4px;color:#ff1e2d;text-shadow:0 0 24px #f00,0 4px 0 #000}
.sub{font-size:18px;opacity:.85;margin:14px 0;letter-spacing:2px}
.big{font-size:min(18vw,96px);font-weight:900;line-height:1}
.rk{font-size:44px;font-weight:900;color:#ffd54a;margin:4px 0}
.tap{font-size:22px;font-weight:900;letter-spacing:3px;margin:18px 0;animation:b 1s infinite alternate}
@keyframes b{to{opacity:.35}}
.btn,.it button{background:#1a0a10;color:#fff;border:2px solid #ff1e2d;border-radius:10px;padding:10px 20px;font-size:16px;font-weight:800;letter-spacing:1px}
.btn:active,.it button:active{background:#ff1e2d}
.it button:disabled{opacity:.45}
#garage{justify-content:flex-start;overflow:auto;touch-action:pan-y}
.gt{font-size:34px;font-weight:900;color:#ff1e2d;margin:16px 0 4px}
#gc{font-size:20px;color:#ffd54a;font-weight:800;margin-bottom:10px}
#gl{width:min(560px,92vw)}
.it{display:flex;justify-content:space-between;align-items:center;text-align:left;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;margin:8px 0}
.it small{opacity:.7}
#gb{margin:14px 0 30px}
#snd{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);width:44px;height:44px;border-radius:50%;border:2px solid #ff1e2d;background:rgba(0,0,0,.5);font-size:20px}
#probe{position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#err{position:fixed;left:0;bottom:0;right:0;z-index:9;background:#300;color:#fff;font:12px monospace;padding:6px;display:none;white-space:pre-wrap}
</style></head><body>
<canvas id="c"></canvas>
<button id="snd">🔊</button>
<div id="menu" class="scr"><div class="t">WEB<br>RIDER</div><div class="sub" id="mbest"></div><div class="tap">TAP TO START</div><button id="mg" class="btn">GARAGE</button></div>
<div id="over" class="scr"><div class="sub">SCORE</div><div class="big" id="osc"></div><div class="rk" id="ork"></div><div class="sub" id="ost"></div><div class="tap">TAP TO RETRY</div><button id="og" class="btn">GARAGE</button></div>
<div id="garage" class="scr"><div class="gt">GARAGE</div><div id="gc"></div><div id="gl"></div><button id="gb" class="btn">BACK</button></div>
<div id="probe"></div><div id="err"></div>
<script>
window.onerror=(m,u,l)=>{const e=document.getElementById('err');e.style.display='block';e.textContent+=m+' ('+l+')\n'};
document.addEventListener('touchmove',e=>{if(!e.target.closest('#garage'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
<script src="audio.js"></script>
<script src="world.js"></script>
<script src="game.js"></script>
</body></html>
