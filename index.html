<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Web Rider</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#sa{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);visibility:hidden}
#err{position:fixed;top:0;left:0;right:0;background:#900;color:#fff;font:12px monospace;padding:6px;z-index:9;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<div id="err"></div>
<script>
addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+=e.message+' ('+(e.lineno||'?')+')\n';});
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
<script src="game.js"></script>
</body>
</html>
