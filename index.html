<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Web Rider</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
* { box-sizing:border-box }
html,body {
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#080b19;color:#fff;font-family:system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
canvas {
  display:block;width:100%;height:100%;touch-action:none;
}
button {
  font:inherit;font-weight:800;color:#fff;background:#14192d;
  border:1px solid #46506a;border-radius:12px;
  padding:12px 20px;cursor:pointer;touch-action:manipulation;
}
button:active { transform:scale(.97) }
button.primary { background:#db153c;border-color:#ff5573 }
button:disabled { opacity:.4 }
.screen {
  position:fixed;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(5,8,19,.78);
  padding:max(18px,env(safe-area-inset-top))
          max(18px,env(safe-area-inset-right))
          max(18px,env(safe-area-inset-bottom))
          max(18px,env(safe-area-inset-left));
}
.screen.visible { display:flex }
.panel { text-align:center;max-width:640px;width:100% }
h1 {
  margin:0;color:#ff365c;font-size:clamp(36px,8vw,76px);
  font-weight:950;letter-spacing:-2px;text-shadow:0 0 28px #ff174466;
}
h2 { margin:0 0 14px }
p { color:#b7c2d9;line-height:1.5;margin:12px 0 20px }
.row {
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
}
.score { font-size:clamp(44px,10vw,88px);font-weight:900 }
.small { font-size:13px;color:#91a0bd }
#hud {
  position:fixed;left:0;right:0;top:0;display:none;
  padding:max(12px,env(safe-area-inset-top)) 16px 0;
  pointer-events:none;align-items:flex-start;justify-content:space-between;
  text-shadow:0 2px 6px #000;font-weight:800;
}
#hud.visible { display:flex }
#hud button { pointer-events:auto;padding:8px 13px;font-size:14px }
#centerHud { text-align:center }
#score { font-size:30px;line-height:1 }
#distance { font-size:12px;color:#9aa9c3;margin-top:5px }
#coins { color:#6dbbff;margin-top:6px }
#toast {
  position:fixed;left:15%;right:15%;bottom:max(38px,env(safe-area-inset-bottom));
  text-align:center;font-size:clamp(18px,4vw,30px);font-weight:900;
  color:#fff;text-shadow:0 2px 5px #000;pointer-events:none;
  opacity:0;transition:opacity .12s;
}
#garageItems {
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;margin:16px 0;
}
.skin {
  border:1px solid #3a4360;border-radius:14px;padding:14px;
  background:#111629;
}
.skin strong { display:block;margin-bottom:10px }
#diagnostics {
  position:fixed;bottom:8px;left:8px;white-space:pre;
  font:11px monospace;color:#b6edff;background:#0009;
  padding:6px;display:none;pointer-events:none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div>
    <div id="best"></div>
    <div id="coins"></div>
  </div>
  <div id="centerHud">
    <div id="score">0</div>
    <div id="distance">0 m</div>
  </div>
  <button id="pauseButton" aria-label="Pause">Ⅱ</button>
</div>
<div id="toast"></div>
<div id="diagnostics"></div>

<div id="menu" class="screen visible">
  <div class="panel">
    <h1>WEB RIDER</h1>
    <p>
      Hold to accelerate on the track.<br>
      Hold in the air to backflip. Release to stop adding spin.<br>
      Land on the wheels. Protect the head.
    </p>
    <div class="row">
      <button class="primary" id="startButton">PLAY</button>
      <button id="garageButton">GARAGE</button>
      <button id="soundButton">SOUND ON</button>
    </div>
    <p class="small" id="menuStats"></p>
  </div>
</div>

<div id="over" class="screen">
  <div class="panel">
    <h2 id="crashTitle">WIPEOUT</h2>
    <div id="finalScore" class="score"></div>
    <p id="runStats"></p>
    <div class="row">
      <button class="primary" id="retryButton">RETRY TRACK</button>
      <button id="newButton">NEW TRACK</button>
      <button id="homeButton">MENU</button>
    </div>
  </div>
</div>

<div id="paused" class="screen">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="row">
      <button class="primary" id="resumeButton">RESUME</button>
      <button id="pauseHomeButton">MENU</button>
    </div>
    <p class="small">Keyboard: Space to hold · P to pause · D for diagnostics</p>
  </div>
</div>

<div id="garage" class="screen">
  <div class="panel">
    <h2>GARAGE</h2>
    <div id="garageBalance"></div>
    <div id="garageItems"></div>
    <button id="garageBackButton">BACK</button>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d', { alpha:false });

const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const wrap = a => Math.atan2(Math.sin(a),Math.cos(a));
const cross = (ax,ay,bx,by) => ax*by-ay*bx;

/*
  World coordinates use positive Y downward.
  The board is one rigid body, with two circular wheel contacts.
  No scripted flight path, landing-angle check, or auto-level force.
*/
const PHYS = Object.freeze({
  dt:1/240,
  gravity:1050,
  inertia:680,
  wheelRadius:8,
  wheelX:23,
  wheelY:10,
  headY:-14,
  headRadius:11,
  drive:920,
  topSpeed:650,
  airTorque:8.2,
  angularDrag:.25,
  rollingDrag:.13,
  airDrag:.015,
  solverIterations:7
});

const WHEELS = [
  { x:-PHYS.wheelX,y:PHYS.wheelY,r:PHYS.wheelRadius },
  { x: PHYS.wheelX,y:PHYS.wheelY,r:PHYS.wheelRadius }
];

const SKINS = [
  { name:'Crimson',color:'#ff3159',cost:0 },
  { name:'Cyan',color:'#25dbff',cost:120 },
  { name:'Gold',color:'#ffd54a',cost:120 },
  { name:'Venom',color:'#80ef42',cost:250 }
];

let saved;
try { saved=JSON.parse(localStorage.getItem('web-rider-rigid-v1')||'{}') }
catch { saved={} }

if (!saved || typeof saved!=='object') saved={};
let store = {
  best:Math.max(0,Number(saved.best)||0),
  gems:Math.max(0,Number(saved.gems)||0),
  skin:clamp(Math.floor(Number(saved.skin)||0),0,3),
  owned:Array.isArray(saved.owned)
    ? SKINS.map((_,i)=>i===0||saved.owned[i]===true)
    : [true,false,false,false],
  sound:saved.sound!==false
};
if (!store.owned[store.skin]) store.skin=0;

function persist() {
  try { localStorage.setItem('web-rider-rigid-v1',JSON.stringify(store)) }
  catch {}
}

let audio;
function unlockAudio() {
  if (!store.sound) return;
  try {
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    if (audio.state==='suspended') audio.resume().catch(()=>{});
  } catch {}
}
function tone(freq,duration=.1,type='sine',volume=.045,end=freq) {
  if (!store.sound || !audio || audio.state!=='running') return;
  try {
    const t=audio.currentTime;
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+duration);
    g.gain.setValueAtTime(volume,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(g);g.connect(audio.destination);
    o.start(t);o.stop(t+duration+.02);
  } catch {}
}
function vibrate(ms) {
  try { navigator.vibrate?.(ms) } catch {}
}

let width=0,height=0,dpr=1,zoom=1;
function resize() {
  width=innerWidth;height=innerHeight;
  dpr=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.round(width*dpr);
  canvas.height=Math.round(height*dpr);
  zoom=clamp(Math.min(width/940,height/510),.38,1.7);
}
addEventListener('resize',resize);
resize();

let randomState=1;
function random() {
  randomState=(Math.imul(randomState,1664525)+1013904223)>>>0;
  return randomState/4294967296;
}
const range=(a,b)=>a+(b-a)*random();
const hash=n=>{
  const v=Math.sin(n*127.1+19.7)*43758.5453;
  return v-Math.floor(v);
};

let segments=[],buckets=new Map(),gems=[],saws=[];
let gx=0,gy=0,pieceNumber=0,trackSeed=1;
const BUCKET=128;

function addSegment(x1,y1,x2,y2) {
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if (len2<.0001) return;
  const s={x1,y1,x2,y2,dx,dy,len2};
  segments.push(s);
  const lo=Math.floor(Math.min(x1,x2)/BUCKET);
  const hi=Math.floor(Math.max(x1,x2)/BUCKET);
  for (let i=lo;i<=hi;i++) {
    if (!buckets.has(i)) buckets.set(i,[]);
    buckets.get(i).push(s);
  }
}
function to(x,y) {
  addSegment(gx,gy,x,y);
  gx=x;gy=y;
}
function curve(length,fn,collect=false) {
  const x0=gx,y0=gy;
  const count=Math.max(2,Math.ceil(length/13));
  for (let i=1;i<=count;i++) {
    const t=i/count;
    to(x0+length*t,y0+fn(t));
    if (collect && i%4===0 && i<count-2) {
      gems.push({x:gx,y:gy-44,taken:false});
    }
  }
}
function flat(length,collect=true) {
  curve(length,()=>0,collect);
}
function hills() {
  const length=range(580,900),h=range(45,85);
  curve(length,t=>-h*(1-Math.cos(TAU*t))/2,true);
}
function ramp(withGap) {
  const rise=range(65,95),run=range(250,310);
  curve(run,t=>-rise*t*t);

  const ex=gx,ey=gy;
  const launchAngle=-Math.atan(2*rise/run);
  const speed=540;
  const vx=Math.cos(launchAngle)*speed;
  const vy=Math.sin(launchAngle)*speed;

  const gap=withGap?range(105,150):0;
  const drop=withGap?range(45,65):range(100,145);

  if (withGap) {
    saws.push({x:ex+gap*.52,y:ey+drop+55,r:23});
    gx+=gap;gy+=drop;
  }

  const landingLength=range(360,440);
  const descent=withGap?range(25,45):drop;
  curve(landingLength,t=>descent*(2*t-t*t),true);

  for (let i=1;i<=6;i++) {
    const t=i*.095;
    gems.push({
      x:ex+vx*t,
      y:ey-35+vy*t+.5*PHYS.gravity*t*t,
      taken:false
    });
  }
}
function loop() {
  const r=155,startX=gx,startY=gy;
  const cx=startX,cy=startY-r;
  const count=110;

  // Travel clockwise from the bottom, inside the circle.
  for (let i=1;i<=count;i++) {
    const a=Math.PI/2-TAU*i/count;
    to(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    if (i%10===0) {
      gems.push({
        x:cx+Math.cos(a)*(r-42),
        y:cy+Math.sin(a)*(r-42),
        taken:false
      });
    }
  }
  // Return exactly to the tangent point before continuing.
  gx=startX;gy=startY;
  flat(r+160,true);
}
function generate(until) {
  while (gx<until) {
    pieceNumber++;
    flat(range(170,270));
    if (gy>170) {
      curve(700,t=>-150*(1-Math.cos(Math.PI*t))/2,true);
      continue;
    }
    if (pieceNumber===1) {
      hills();
    } else if (pieceNumber===2) {
      ramp(false);
    } else if (pieceNumber===3) {
      ramp(true);
    } else if (pieceNumber>8 && pieceNumber%9===0) {
      flat(500,true);
      loop();
    } else {
      const r=random();
      if (r<.42) hills();
      else if (r<.74) ramp(false);
      else ramp(true);
    }
  }
}
function resetTrack(seed) {
  randomState=seed>>>0;
  segments=[];buckets=new Map();gems=[];saws=[];
  pieceNumber=0;gx=-700;gy=0;
  flat(1750,true);
  generate(3600);
}

function nearby(x,r=45) {
  const found=new Set();
  const a=Math.floor((x-r)/BUCKET);
  const b=Math.floor((x+r)/BUCKET);
  for (let i=a;i<=b;i++) {
    for (const s of buckets.get(i)||[]) found.add(s);
  }
  return found;
}
function closest(s,x,y) {
  const t=clamp(((x-s.x1)*s.dx+(y-s.y1)*s.dy)/s.len2,0,1);
  return {x:s.x1+t*s.dx,y:s.y1+t*s.dy};
}

let body;
function localPoint(x,y) {
  const c=Math.cos(body.a),s=Math.sin(body.a);
  const rx=x*c-y*s,ry=x*s+y*c;
  return {x:body.x+rx,y:body.y+ry,rx,ry};
}
function wheelContact(w,localSegments) {
  const p=localPoint(w.x,w.y);
  let best=null;
  for (const seg of localSegments) {
    const q=closest(seg,p.x,p.y);
    const dx=p.x-q.x,dy=p.y-q.y;
    const distance=Math.hypot(dx,dy);
    const depth=w.r-distance;
    if (depth<=0) continue;
    if (!best || depth>best.depth) {
      let nx,ny;
      if (distance>.00001) {
        nx=dx/distance;ny=dy/distance;
      } else {
        const length=Math.sqrt(seg.len2);
        nx=seg.dy/length;ny=-seg.dx/length;
      }
      const rx=p.rx-nx*w.r;
      const ry=p.ry-ny*w.r;
      const rn=cross(rx,ry,nx,ny);
      best={
        nx,ny,rx,ry,rn,depth,
        effective:1+rn*rn/PHYS.inertia,
        accumulated:0
      };
    }
  }
  return best;
}
function circleHits(x,y,r,localSegments) {
  for (const seg of localSegments) {
    const q=closest(seg,x,y);
    if ((x-q.x)**2+(y-q.y)**2<r*r) return true;
  }
  return false;
}

let state='menu';
let time=0,runTime=0,bonus=0,runGems=0,maxX=100;
let airTime=0,airRotation=0,landing=null;
let lastSupportY=0,wheelPhase=0,shake=0;
let toastTime=0,toastText='',diagnostics=false;
let camera={x:100,y:-85};
let elapsed=0,lastFrame=performance.now();
let particles=[];
let heldKeys=new Set(),pointers=new Set();

function held() {
  return state==='play' && (heldKeys.size>0 || pointers.size>0);
}
function clearInput() {
  heldKeys.clear();pointers.clear();
}
function distance() { return Math.max(0,(maxX-100)/10) }
function score() { return Math.floor(distance())+bonus }
function showToast(text,duration=1.5) {
  toastText=text;toastTime=duration;
  $('toast').textContent=text;
}
function setScreen(next) {
  state=next;
  clearInput();
  for (const name of ['menu','over','paused','garage']) {
    $(name).classList.toggle('visible',name===next);
  }
  $('hud').classList.toggle('visible',next==='play'||next==='paused');
  $('toast').style.opacity='0';
  updateMenu();
}
function updateMenu() {
  $('menuStats').textContent=`BEST ${store.best} · ◆ ${store.gems}`;
  $('soundButton').textContent=store.sound?'SOUND ON':'SOUND OFF';
}
function freshSeed() {
  return (Math.random()*4294967296)>>>0;
}
function start(seed=trackSeed) {
  trackSeed=seed;
  resetTrack(seed);
  body={
    x:100,y:-18,vx:0,vy:0,a:0,w:0,
    grounded:false,contactCount:0
  };
  camera={x:100,y:-85};
  runTime=0;bonus=0;runGems=0;maxX=100;
  airTime=0;airRotation=0;landing=null;
  lastSupportY=0;wheelPhase=0;shake=0;
  particles=[];toastTime=0;elapsed=0;
  unlockAudio();
  setScreen('play');
}
function burst(x,y,color,count=12) {
  for (let i=0;i<count;i++) {
    particles.push({
      x,y,vx:range(-180,180),vy:range(-250,100),
      life:range(.25,.65),color
    });
  }
}
function crash(reason) {
  if (state!=='play') return;
  const result=score(),isBest=result>store.best;
  store.best=Math.max(store.best,result);
  persist();
  burst(body.x,body.y,SKINS[store.skin].color,25);
  shake=10;
  tone(150,.32,'sawtooth',.09,35);
  vibrate(90);
  $('crashTitle').textContent=isBest?'NEW BEST':'WIPEOUT';
  $('finalScore').textContent=result;
  $('runStats').textContent=
    `${Math.floor(distance())} m · ◆ ${runGems} · ${reason}`;
  setScreen('over');
}
function awardLanding() {
  if (!landing) return;
  const flips=Math.floor((Math.abs(landing.rotation)+.12)/TAU);
  if (flips>0) {
    const points=100*flips*flips;
    bonus+=points;
    const name=flips===1?'BACKFLIP':
      flips===2?'DOUBLE BACKFLIP':
      flips===3?'TRIPLE BACKFLIP':`${flips}× BACKFLIP`;
    showToast(`${name} +${points}`);
    tone(620,.15,'triangle',.07,1100);
  }
  landing=null;
}

function physicsStep(dt) {
  if (state!=='play') return;
  runTime+=dt;

  // Forces affect velocity; they never prescribe position or orientation.
  body.vy+=PHYS.gravity*dt;
  if (held()) {
    if (body.grounded) {
      const c=Math.cos(body.a),s=Math.sin(body.a);
      const forward=body.vx*c+body.vy*s;
      const available=clamp((PHYS.topSpeed-forward)/140,0,1);
      body.vx+=c*PHYS.drive*available*dt;
      body.vy+=s*PHYS.drive*available*dt;
    } else {
      // Gradual torque reduction at very high spin, not a target spin rate.
      const factor=1/(1+(Math.abs(body.w)/10)**4);
      body.w-=PHYS.airTorque*factor*dt;
    }
  }

  const drag=body.grounded?PHYS.rollingDrag:PHYS.airDrag;
  body.vx*=Math.exp(-drag*dt);
  body.w*=Math.exp(-PHYS.angularDrag*dt);

  const previousAngle=body.a;
  body.x+=body.vx*dt;
  body.y+=body.vy*dt;
  body.a+=body.w*dt;

  let localSegments=nearby(body.x,55);
  const contacts=[];
  for (const wheel of WHEELS) {
    const contact=wheelContact(wheel,localSegments);
    if (contact) contacts.push(contact);
  }

  // Unilateral impulses: the track can push a wheel, never pull it.
  for (let iteration=0;iteration<PHYS.solverIterations;iteration++) {
    for (const c of contacts) {
      const vx=body.vx-body.w*c.ry;
      const vy=body.vy+body.w*c.rx;
      const vn=vx*c.nx+vy*c.ny;
      const bias=Math.min(45,.12*Math.max(0,c.depth-.15)/dt);
      const impulse=(bias-vn)/c.effective;
      const next=Math.max(0,c.accumulated+impulse);
      const applied=next-c.accumulated;
      c.accumulated=next;
      body.vx+=c.nx*applied;
      body.vy+=c.ny*applied;
      body.w+=c.rn*applied/PHYS.inertia;
    }
  }

  // Small position corrections remove overlap without snapping to a slope.
  for (let iteration=0;iteration<3;iteration++) {
    for (const wheel of WHEELS) {
      const c=wheelContact(wheel,localSegments);
      if (!c) continue;
      const correction=.38*Math.max(0,c.depth-.12)/c.effective;
      body.x+=c.nx*correction;
      body.y+=c.ny*correction;
      body.a+=c.rn*correction/PHYS.inertia;
    }
  }

  const wasGrounded=body.grounded;
  body.grounded=contacts.length>0;
  body.contactCount=contacts.length;

  if (!body.grounded) {
    if (wasGrounded) {
      airTime=0;airRotation=0;
    }
    airTime+=dt;
    airRotation+=body.a-previousAngle;
    if (landing) {
      landing.groundedTime=0;
      landing.life-=dt;
      if (landing.life<=0) landing=null;
    }
  } else {
    lastSupportY=body.y;
    if (!wasGrounded && airTime>.18) {
      landing={
        rotation:airRotation,
        groundedTime:0,
        life:.55
      };
      tone(85,.055,'sine',.025,45);
    }
    airTime=0;airRotation=0;
    if (landing) {
      landing.groundedTime+=dt;
      if (landing.groundedTime>.14) awardLanding();
    }
  }

  const head=localPoint(0,PHYS.headY);
  if (circleHits(head.x,head.y,PHYS.headRadius,localSegments)) {
    crash('Head impact');return;
  }

  for (const x of [-31,0,31]) {
    const chassis=localPoint(x,3);
    if (circleHits(chassis.x,chassis.y,3,localSegments)) {
      crash('Board impact');return;
    }
  }

  for (const saw of saws) {
    if (Math.abs(saw.x-body.x)>75) continue;
    if (Math.hypot(body.x-saw.x,body.y-saw.y)<saw.r+16 ||
        Math.hypot(head.x-saw.x,head.y-saw.y)<saw.r+PHYS.headRadius) {
      crash('Saw impact');return;
    }
  }

  if (body.y>lastSupportY+650) {
    crash('Missed the track');return;
  }

  maxX=Math.max(maxX,body.x);
  wheelPhase+=body.vx*dt/PHYS.wheelRadius;

  for (const gem of gems) {
    if (gem.taken || Math.abs(gem.x-body.x)>60) continue;
    if (Math.hypot(head.x-gem.x,head.y-gem.y)<27 ||
        Math.hypot(body.x-gem.x,body.y-gem.y)<25) {
      gem.taken=true;
      runGems++;store.gems++;bonus+=5;
      burst(gem.x,gem.y,'#65baff',5);
      tone(950+(runGems%5)*110,.065,'triangle',.025);
    }
  }

  if (gx<body.x+2500) generate(body.x+3500);

  // Retain a generous window behind the player for reverse movement.
  if (segments.length>2200 && runTime%2<dt) {
    const cutoff=body.x-3500;
    segments=segments.filter(s=>Math.max(s.x1,s.x2)>cutoff);
    gems=gems.filter(g=>g.x>cutoff);
    saws=saws.filter(s=>s.x>cutoff);
    for (const key of buckets.keys()) {
      if ((key+1)*BUCKET<cutoff) buckets.delete(key);
    }
  }
}

function background() {
  const g=ctx.createLinearGradient(0,0,0,height);
  g.addColorStop(0,'#080b19');
  g.addColorStop(.65,'#11112c');
  g.addColorStop(1,'#23112c');
  ctx.fillStyle=g;ctx.fillRect(0,0,width,height);

  ctx.fillStyle='#d9e2ff';
  ctx.globalAlpha=.65;
  for (let i=0;i<48;i++) {
    const x=hash(i*3)*width;
    const y=hash(i*3+1)*height*.57;
    ctx.fillRect(x,y,hash(i*3+2)> .75?2:1,1);
  }
  ctx.globalAlpha=1;

  ctx.fillStyle='#d6ddf014';
  ctx.beginPath();
  ctx.arc(width*.79,height*.19,Math.min(width,height)*.065,0,TAU);
  ctx.fill();

  const layers=[
    {scale:.06,color:'#11152a',base:.73,bw:60,h:150},
    {scale:.13,color:'#0b1020',base:.86,bw:85,h:185},
    {scale:.22,color:'#070c18',base:1,bw:110,h:220}
  ];
  for (let li=0;li<layers.length;li++) {
    const l=layers[li];
    const off=camera.x*l.scale;
    const first=Math.floor(off/l.bw)-1;
    const base=height*l.base;
    for (let i=first;i*l.bw-off<width+l.bw;i++) {
      const x=i*l.bw-off;
      const h=(.35+.65*hash(i+li*211))*l.h;
      ctx.fillStyle=l.color;
      ctx.fillRect(x,base-h,l.bw-3,height);
      if (li===1) {
        ctx.fillStyle='#e6c37724';
        for (let col=0;col<5;col++) {
          for (let row=0;row<7;row++) {
            if (hash(i*83+col*11+row)<.55) continue;
            const y=base-h+13+row*19;
            if (y<base-10) ctx.fillRect(x+10+col*14,y,3,5);
          }
        }
      }
    }
  }
}

function drawTrack(left,right) {
  const visible=new Set();
  for (let i=Math.floor(left/BUCKET);i<=Math.floor(right/BUCKET);i++) {
    for (const s of buckets.get(i)||[]) visible.add(s);
  }
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  for (const s of visible) {
    ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
  }
  ctx.strokeStyle='#ff1949';
  ctx.lineWidth=5;
  ctx.shadowColor='#ff1949';ctx.shadowBlur=15;
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#ffc2d0';ctx.lineWidth=1.4;ctx.stroke();
}

function diamond(x,y,size=8) {
  ctx.beginPath();
  ctx.moveTo(x,y-size);
  ctx.lineTo(x+size*.7,y-2);
  ctx.lineTo(x,y+size);
  ctx.lineTo(x-size*.7,y-2);
  ctx.closePath();
  ctx.fillStyle='#57aaff';ctx.fill();
  ctx.strokeStyle='#bbecff';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-size);ctx.lineTo(x,y+size);
  ctx.strokeStyle='#ffffff70';ctx.stroke();
}
function drawObjects(left,right) {
  for (const gem of gems) {
    if (!gem.taken && gem.x>left && gem.x<right) {
      diamond(gem.x,gem.y);
    }
  }
  for (const saw of saws) {
    if (saw.x<left-40 || saw.x>right+40) continue;
    ctx.save();ctx.translate(saw.x,saw.y);ctx.rotate(time*3);
    ctx.beginPath();
    for (let i=0;i<32;i++) {
      const a=i*TAU/32,r=i%2?saw.r*.74:saw.r;
      if (!i) ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
      else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath();ctx.fillStyle='#ed3151';ctx.fill();
    ctx.strokeStyle='#ffbac9';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,5,0,TAU);
    ctx.fillStyle='#151126';ctx.fill();ctx.restore();
  }
}

function drawPlayer() {
  const color=SKINS[store.skin].color;
  ctx.save();
  ctx.translate(body.x,body.y);ctx.rotate(body.a);

  for (const wheel of WHEELS) {
    ctx.save();ctx.translate(wheel.x,wheel.y);ctx.rotate(wheelPhase);
    ctx.beginPath();ctx.arc(0,0,wheel.r,0,TAU);
    ctx.fillStyle='#101523';ctx.fill();
    ctx.strokeStyle='#eef5ff';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(4,0);
    ctx.moveTo(0,-4);ctx.lineTo(0,4);
    ctx.strokeStyle='#6ba9ff';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
  }

  ctx.beginPath();
  ctx.moveTo(-34,0);
  ctx.quadraticCurveTo(-30,5,-23,5);
  ctx.lineTo(23,5);
  ctx.quadraticCurveTo(30,5,34,0);
  ctx.strokeStyle=color;ctx.lineWidth=5;
  ctx.shadowColor=color;ctx.shadowBlur=9;ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#ffffffb0';ctx.lineWidth=1;ctx.stroke();

  ctx.translate(0,PHYS.headY);
  ctx.beginPath();ctx.arc(0,0,PHYS.headRadius,0,TAU);
  ctx.fillStyle=store.skin===3?'#1c2330':'#e52243';ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=1.2;ctx.stroke();

  ctx.save();
  ctx.beginPath();ctx.arc(0,0,PHYS.headRadius,0,TAU);ctx.clip();
  ctx.strokeStyle='#270817aa';ctx.lineWidth=.75;
  for (let i=0;i<8;i++) {
    const a=i*TAU/8;
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*12,Math.sin(a)*12);ctx.stroke();
  }
  for (const r of [5,9]) {
    ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();
  }
  ctx.restore();

  for (const sign of [-1,1]) {
    ctx.beginPath();
    ctx.moveTo(sign*2,0);
    ctx.lineTo(sign*9,-4);
    ctx.quadraticCurveTo(sign*9,4,sign*4,4);
    ctx.closePath();
    ctx.fillStyle='#fff';ctx.fill();
    ctx.strokeStyle='#160d19';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.restore();

  if (diagnostics) {
    ctx.strokeStyle='#62faff';ctx.lineWidth=.7;
    for (const wheel of WHEELS) {
      const p=localPoint(wheel.x,wheel.y);
      ctx.beginPath();ctx.arc(p.x,p.y,wheel.r,0,TAU);ctx.stroke();
    }
    const p=localPoint(0,PHYS.headY);
    ctx.beginPath();ctx.arc(p.x,p.y,PHYS.headRadius,0,TAU);ctx.stroke();
  }
}
function render() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  background();

  const anchorX=width*.31,anchorY=height*.64;
  const sx=(Math.random()-.5)*shake;
  const sy=(Math.random()-.5)*shake;
  ctx.setTransform(
    dpr*zoom,0,0,dpr*zoom,
    dpr*(anchorX-camera.x*zoom+sx),
    dpr*(anchorY-camera.y*zoom+sy)
  );

  const left=camera.x-anchorX/zoom-80;
  const right=camera.x+(width-anchorX)/zoom+80;
  drawTrack(left,right);
  drawObjects(left,right);
  if (state!=='over') drawPlayer();

  for (const p of particles) {
    ctx.globalAlpha=clamp(p.life*2,0,1);
    ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  $('score').textContent=score();
  $('distance').textContent=`${Math.floor(distance())} m`;
  $('best').textContent=`BEST ${store.best}`;
  $('coins').textContent=`◆ ${store.gems}`;
  $('toast').style.opacity=
    state==='play'&&toastTime>0?String(Math.min(1,toastTime*3)):'0';

  $('diagnostics').style.display=diagnostics?'block':'none';
  if (diagnostics) {
    $('diagnostics').textContent=
      `seed ${trackSeed}\n`+
      `speed ${Math.hypot(body.vx,body.vy).toFixed(1)}\n`+
      `spin ${body.w.toFixed(2)} rad/s\n`+
      `contacts ${body.contactCount}\n`+
      `air ${airTime.toFixed(2)} s`;
  }
}

function updateGarage() {
  $('garageBalance').textContent=`◆ ${store.gems}`;
  $('garageItems').replaceChildren();

  SKINS.forEach((skin,i)=>{
    const item=document.createElement('div');
    item.className='skin';
    const name=document.createElement('strong');
    name.textContent=skin.name;name.style.color=skin.color;
    const button=document.createElement('button');
    button.textContent=store.skin===i?'SELECTED':
      store.owned[i]?'USE':`◆ ${skin.cost}`;
    button.disabled=store.skin===i||
      (!store.owned[i]&&store.gems<skin.cost);
    button.addEventListener('click',()=>{
      if (!store.owned[i]) {
        if (store.gems<skin.cost) return;
        store.gems-=skin.cost;store.owned[i]=true;
      }
      store.skin=i;persist();updateGarage();
    });
    item.append(name,button);
    $('garageItems').append(item);
  });
}

function pause() {
  if (state==='play') {
    persist();setScreen('paused');elapsed=0;
  }
}
function resume() {
  if (state==='paused') {
    unlockAudio();setScreen('play');
    elapsed=0;lastFrame=performance.now();
  }
}
function home() {
  persist();setScreen('menu');elapsed=0;
}

$('startButton').onclick=()=>start(freshSeed());
$('retryButton').onclick=()=>start(trackSeed);
$('newButton').onclick=()=>start(freshSeed());
$('homeButton').onclick=home;
$('pauseHomeButton').onclick=home;
$('pauseButton').onclick=pause;
$('resumeButton').onclick=resume;
$('garageButton').onclick=()=>{
  updateGarage();setScreen('garage');
};
$('garageBackButton').onclick=()=>setScreen('menu');
$('soundButton').onclick=()=>{
  store.sound=!store.sound;
  if (store.sound) unlockAudio();
  persist();updateMenu();
};

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if (state!=='play') return;
  unlockAudio();pointers.add(e.pointerId);
  try { canvas.setPointerCapture(e.pointerId) } catch {}
});
function releasePointer(e) { pointers.delete(e.pointerId) }
canvas.addEventListener('pointerup',releasePointer);
canvas.addEventListener('pointercancel',releasePointer);
canvas.addEventListener('lostpointercapture',releasePointer);
addEventListener('pointerup',releasePointer);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

const driveKeys=new Set(['Space','ArrowUp','ArrowRight','KeyW']);
addEventListener('keydown',e=>{
  if (e.target instanceof HTMLButtonElement) return;
  if (driveKeys.has(e.code)) {
    e.preventDefault();
    if (state==='play') {
      unlockAudio();heldKeys.add(e.code);
    }
  }
  if (e.repeat) return;
  if (e.code==='KeyP'||e.code==='Escape') {
    state==='paused'?resume():pause();
  }
  if (e.code==='KeyD') diagnostics=!diagnostics;
});
addEventListener('keyup',e=>heldKeys.delete(e.code));
addEventListener('blur',()=>{clearInput();pause()});
document.addEventListener('visibilitychange',()=>{
  if (document.hidden) {clearInput();pause()}
});
addEventListener('pagehide',persist);

function frame(now) {
  const raw=Math.max(0,(now-lastFrame)/1000);
  const dt=Math.min(.04,raw);
  lastFrame=now;
  time+=dt;

  if (state==='play') {
    elapsed+=dt;
    let steps=0;
    while (elapsed>=PHYS.dt && steps<12) {
      physicsStep(PHYS.dt);
      elapsed-=PHYS.dt;
      steps++;
      if (state!=='play') {elapsed=0;break}
    }
    if (steps===12) elapsed=Math.min(elapsed,PHYS.dt);

    const targetX=body.x+clamp(body.vx*.12,0,85);
    const targetY=body.y-72;
    camera.x+=(targetX-camera.x)*(1-Math.exp(-7*dt));
    camera.y+=(targetY-camera.y)*(1-Math.exp(-3.6*dt));
  }

  if (state!=='paused') {
    toastTime=Math.max(0,toastTime-dt);
    shake*=Math.exp(-9*dt);
    for (const p of particles) {
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vy+=700*dt;p.life-=dt;
    }
    particles=particles.filter(p=>p.life>0);
  }

  render();
  requestAnimationFrame(frame);
}

// Static preview. Physics begins only when PLAY is pressed.
trackSeed=freshSeed();
resetTrack(trackSeed);
body={
  x:100,y:-18,vx:0,vy:0,a:0,w:0,
  grounded:false,contactCount:0
};
updateMenu();
requestAnimationFrame(frame);

// Reuse the existing external PWA service worker, if hosted securely.
if ('serviceWorker' in navigator &&
    (location.protocol==='https:' || location.hostname==='localhost')) {
  addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(reg=>reg.update())
      .catch(()=>{});
  });
}
})();
</script>
</body>
